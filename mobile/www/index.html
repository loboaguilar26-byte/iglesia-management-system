<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>IgleTech · Sin conexión</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(ellipse at 70% 10%, #6b3f24 0%, #2a170c 60%); color: #f6efe5; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 72px; height: 72px; border-radius: 18px; background: #f6efe5; padding: 10px; }
    h1 { font-size: 1.5rem; margin: 20px 0 8px; }
    p { margin: 0 auto; max-width: 30ch; opacity: .8; line-height: 1.5; }
    button { margin-top: 24px; border: 0; border-radius: 12px; padding: 12px 22px; font-size: 1rem; font-weight: 600; background: #e0b15f; color: #2a170c; }
  </style>
</head>
<body>
  <main>
    <img src="igletech-mark.svg" alt="" />
    <h1>Sin conexión</h1>
    <p>No pudimos llegar al servidor de la iglesia. Revisa tu internet e inténtalo de nuevo.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
