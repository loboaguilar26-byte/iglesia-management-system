name: Reportar una falla
description: Algo no funciona como debería.
labels: ["falla"]
body:
  - type: textarea
    id: que-paso
    attributes:
      label: ¿Qué pasó?
      description: Describe la falla. No incluyas contraseñas ni datos reales de personas.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirla
      placeholder: |
        1. Entré a /admin/miembros con el rol Secretario
        2. …
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: ¿Qué esperabas que pasara?
  - type: dropdown
    id: apartado
    attributes:
      label: Apartado
      options: [Sitio público, Panel administrativo, Portal del miembro, App móvil, Otro]
    validations:
      required: true
  - type: input
    id: dispositivo
    attributes:
      label: Dispositivo y navegador
      placeholder: "Ej. Android 15, Chrome"
